name: Research quality
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source and tools
        run: python -m pip install -e ".[data,dev,docs]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Research structure validation
        run: python scripts/validate_research.py
      - name: Sphinx documentation
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
      - name: Check scientific change protocol on PR
        if: github.event_name == 'pull_request'
        run: python scripts/check_change_protocol.py --base-ref "origin/${{ github.base_ref }}"
